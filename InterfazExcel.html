    function barajarFisherYates(arreglo) {
      const copia = [...arreglo];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copia[i];
        copia[i] = copia[j];
        copia[j] = temp;
      }
      return copia;
    }

    function construirBanco60Retos() {
      const hojas = [
        "Inventario", "Nomina", "Proveedores", "Catalogo", "Logistica",
        "Pacientes", "Matriculas", "Despachos", "Activos", "Cartera",
        "Facturacion", "Bodega", "Tarifas", "Personal", "Exportaciones"
      ];
      const rangos = [
        { ini: "A2", fin: "F85", cols: 6 },
        { ini: "B4", fin: "H120", cols: 7 },
        { ini: "A3", fin: "E250", cols: 5 },
        { ini: "C5", fin: "J90", cols: 8 },
        { ini: "A2", fin: "G310", cols: 7 },
        { ini: "B3", fin: "I145", cols: 8 },
        { ini: "A5", fin: "D75", cols: 4 },
        { ini: "C2", fin: "K180", cols: 9 }
      ];
      const celdasValor = ["A2", "B2", "C3", "D4", "E2", "F3", "G2", "A5", "B6", "C4"];
      const parametrosOrden = [
        { tipo: "exacta", texto: "coincidencia exacta", validos: ["FALSO", "0"], sugerido: "FALSO" },
        { tipo: "exacta0", texto: "coincidencia exacta (usando código numérico o lógico)", validos: ["0", "FALSO"], sugerido: "0" },
        { tipo: "aprox", texto: "coincidencia aproximada", validos: ["VERDADERO", "1"], sugerido: "VERDADERO" },
        { tipo: "aprox1", texto: "coincidencia aproximada (usando valor lógico o binario)", validos: ["1", "VERDADERO"], sugerido: "1" }
      ];
      const campos = [
        "el costo unitario", "el nombre del titular", "el estado del envío",
        "la fecha de vencimiento", "el código de barra", "el salario básico",
        "la categoría fiscal", "el teléfono de contacto", "el saldo pendiente",
        "la ubicación en estante", "el porcentaje de descuento", "el correo institucional"
      ];

      const retos = [];
      for (let i = 0; i < 60; i++) {
        const esHojaExterna = i % 2 === 0;
        const hoja = hojas[i % hojas.length];
        const rangoObj = rangos[i % rangos.length];
        const colIndicador = ((i + 1) % (rangoObj.cols - 1)) + 2;
        const celdaBuscada = celdasValor[i % celdasValor.length];
        const param = parametrosOrden[i % parametrosOrden.length];
        const campo = campos[i % campos.length];

        const colIni = rangoObj.ini.match(/[A-Z]+/)[0];
        const filaIni = rangoObj.ini.match(/\d+/)[0];
        const colFin = rangoObj.fin.match(/[A-Z]+/)[0];
        const filaFin = rangoObj.fin.match(/\d+/)[0];

        const rangoAbsoluto = `$${colIni}$${filaIni}:$${colFin}$${filaFin}`;
        const prefijoHoja = esHojaExterna ? `${hoja}!` : "";
        const descripcionUbicacion = esHojaExterna
          ? `en la hoja externa llamada "${hoja}" dentro del rango ${rangoObj.ini}:${rangoObj.fin}`
          : `en la misma hoja activa dentro del rango ${rangoObj.ini}:${rangoObj.fin}`;

        const enunciado = `En el cuadro de entrada y edición de fórmulas de la interfaz de Excel, estructure una fórmula con la función BUSCARV (o CONSULTAV) para localizar ${campo}. El valor buscado se encuentra en la celda ${celdaBuscada}, la matriz de búsqueda está ubicada ${descripcionUbicacion} (es obligatorio fijar la matriz con referencias absolutas $), el indicador de columnas es ${colIndicador} y se requiere ${param.texto}. Recuerde separar los argumentos con punto y coma (;).`;

        const solucionMuestra = `=BUSCARV(${celdaBuscada};${prefijoHoja}${rangoAbsoluto};${colIndicador};${param.sugerido})`;

        retos.push({
          id: i + 1,
          enunciado,
          celdaBuscada,
          esHojaExterna,
          hoja: hoja.toUpperCase(),
          rangoAbsoluto,
          colIndicador: String(colIndicador),
          validosOrden: param.validos,
          solucionMuestra
        });
      }
      return retos;
    }

    function construirCrucigrama2D(conceptosBarajados) {
      const N = 22;
      const seleccionados = conceptosBarajados.slice(0, 15);
      // Garantizar mínimo 40% horizontal (7-8) y 40% vertical (7-8)
      const direcciones = [];
      for (let i = 0; i < 15; i++) {
        direcciones.push(i < 8 ? "H" : "V");
      }
      const dirMezcladas = barajarFisherYates(direcciones);

      const grid = Array.from({ length: N }, () => Array(N).fill(null));
      const palabrasColocadas = [];

      function puedeColocar(palabra, fila, col, dir) {
        if (dir === "H") {
          if (col + palabra.length > N) return false;
          if (col > 0 && grid[fila][col - 1] !== null) return false;
          if (col + palabra.length < N && grid[fila][col + palabra.length] !== null) return false;
          for (let k = 0; k < palabra.length; k++) {
            const actual = grid[fila][col + k];
            if (actual !== null && actual !== palabra[k]) return false;
            if (actual === null) {
              if (fila > 0 && grid[fila - 1][col + k] !== null) return false;
              if (fila < N - 1 && grid[fila + 1][col + k] !== null) return false;
            }
          }
          return true;
        } else {
          if (fila + palabra.length > N) return false;
          if (fila > 0 && grid[fila - 1][col] !== null) return false;
          if (fila + palabra.length < N && grid[fila + palabra.length][col] !== null) return false;
          for (let k = 0; k < palabra.length; k++) {
            const actual = grid[fila + k][col];
            if (actual !== null && actual !== palabra[k]) return false;
            if (actual === null) {
              if (col > 0 && grid[fila + k][col - 1] !== null) return false;
              if (col < N - 1 && grid[fila + k][col + 1] !== null) return false;
            }
          }
          return true;
        }
      }

      seleccionados.forEach((item, idx) => {
        const palabra = item.palabra.toUpperCase();
        const dirPreferida = dirMezcladas[idx];
        let colocada = false;

        // Intentar cruce con palabras existentes primero
        if (palabrasColocadas.length > 0) {
          for (const prev of palabrasColocadas) {
            if (colocada) break;
            const dirIntento = prev.dir === "H" ? "V" : "H";
            if (dirIntento !== dirPreferida) continue;
            for (let i = 0; i < palabra.length; i++) {
              if (colocada) break;
              for (let j = 0; j < prev.palabra.length; j++) {
                if (palabra[i] === prev.palabra[j]) {
                  const f = dirIntento === "V" ? prev.fila - i : prev.fila + j;
                  const c = dirIntento === "V" ? prev.col + j : prev.col - i;
                  if (f >= 0 && c >= 0 && puedeColocar(palabra, f, c, dirIntento)) {
                    for (let k = 0; k < palabra.length; k++) {
                      const rf = dirIntento === "V" ? f + k : f;
                      const rc = dirIntento === "H" ? c + k : c;
                      grid[rf][rc] = palabra[k];
                    }
                    palabrasColocadas.push({
                      num: idx + 1,
                      palabra,
                      pista: item.pista,
                      fila: f,
                      col: c,
                      dir: dirIntento
                    });
                    colocada = true;
                    break;
                  }
                }
              }
            }
          }
        }

        // Si no cruzó, buscar posición libre en la cuadrícula respetando la dirección asignada
        if (!colocada) {
          const ordenFilas = barajarFisherYates(Array.from({ length: N }, (_, i) => i));
          const ordenCols = barajarFisherYates(Array.from({ length: N }, (_, i) => i));
          for (const f of ordenFilas) {
            if (colocada) break;
            for (const c of ordenCols) {
              if (puedeColocar(palabra, f, c, dirPreferida)) {
                for (let k = 0; k < palabra.length; k++) {
                  const rf = dirPreferida === "V" ? f + k : f;
                  const rc = dirPreferida === "H" ? c + k : c;
                  grid[rf][rc] = palabra[k];
                }
                palabrasColocadas.push({
                  num: idx + 1,
                  palabra,
                  pista: item.pista,
                  fila: f,
                  col: c,
                  dir: dirPreferida
                });
                colocada = true;
                break;
              }
            }
          }
        }

        // Respaldo garantizado en caso de saturación
        if (!colocada) {
          const dirAlt = dirPreferida === "H" ? "V" : "H";
          for (let f = 0; f < N && !colocada; f++) {
            for (let c = 0; c < N && !colocada; c++) {
              if (puedeColocar(palabra, f, c, dirAlt)) {
                for (let k = 0; k < palabra.length; k++) {
                  const rf = dirAlt === "V" ? f + k : f;
                  const rc = dirAlt === "H" ? c + k : c;
                  grid[rf][rc] = palabra[k];
                }
                palabrasColocadas.push({
                  num: idx + 1,
                  palabra,
                  pista: item.pista,
                  fila: f,
                  col: c,
                  dir: dirAlt
                });
                colocada = true;
              }
            }
          }
        }
      });

      return { N, palabras: palabrasColocadas };
    }

    function construirSopaDeLetras18x18(conceptosBarajados) {
      const TAM = 18;
      const candidatos = conceptosBarajados.filter(c => c.palabra.length <= 14).slice(0, 15);
      const matriz = Array.from({ length: TAM }, () => Array(TAM).fill(""));
      const ubicaciones = [];

      candidatos.forEach((item, idx) => {
        const palabra = item.palabra.toUpperCase();
        const dirs = barajarFisherYates(["H", "V"]); // SOLO horizontal (izq-der) y vertical (arr-aba)
        let puesta = false;

        for (const dir of dirs) {
          if (puesta) break;
          const filasDisp = barajarFisherYates(
            Array.from({ length: dir === "V" ? TAM - palabra.length + 1 : TAM }, (_, i) => i)
          );
          const colsDisp = barajarFisherYates(
            Array.from({ length: dir === "H" ? TAM - palabra.length + 1 : TAM }, (_, i) => i)
          );

          for (const f of filasDisp) {
            if (puesta) break;
            for (const c of colsDisp) {
              let valido = true;
              for (let k = 0; k < palabra.length; k++) {
                const rf = dir === "V" ? f + k : f;
                const rc = dir === "H" ? c + k : c;
                if (matriz[rf][rc] !== "" && matriz[rf][rc] !== palabra[k]) {
                  valido = false;
                  break;
                }
              }
              if (valido) {
                for (let k = 0; k < palabra.length; k++) {
                  const rf = dir === "V" ? f + k : f;
                  const rc = dir === "H" ? c + k : c;
                  matriz[rf][rc] = palabra[k];
                }
                const fFin = dir === "V" ? f + palabra.length - 1 : f;
                const cFin = dir === "H" ? c + palabra.length - 1 : c;
                ubicaciones.push({
                  id: idx + 1,
                  palabra,
                  pista: item.pista,
                  fIni: f,
                  cIni: c,
                  fFin,
                  cFin,
                  dir
                });
                puesta = true;
                break;
              }
            }
          }
        }
      });

      const alfabeto = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
      for (let f = 0; f < TAM; f++) {
        for (let c = 0; c < TAM; c++) {
          if (matriz[f][c] === "") {
            matriz[f][c] = alfabeto[Math.floor(Math.random() * alfabeto.length)];
          }
        }
      }

      return { TAM, matriz, palabrasSopa: ubicaciones };
    }

      const [evaluacionFinalizada, setEvaluacionFinalizada] = useState(false);

      // Estados de los 4 módulos generados en tiempo de ejecución

      const [retosSeleccionados, setRetosSeleccionados] = useState([]);

      const [preguntasSeleccionadas, setPreguntasSeleccionadas] = useState([]);
      const [respuestasTest, setRespuestasTest] = useState({});

      const [fechaEntrega, setFechaEntrega] = useState("");
      const reporteRef = useRef(null);

      // Prevención de recargas accidentales (beforeunload)
      useEffect(() => {
        const manejarBeforeUnload = (e) => {
          if (evaluacionIniciada && !evaluacionFinalizada) {
            e.preventDefault();
            e.returnValue = "";
          }
        };
        window.addEventListener("beforeunload", manejarBeforeUnload);
        return () => window.removeEventListener("beforeunload", manejarBeforeUnload);
      }, [evaluacionIniciada, evaluacionFinalizada]);

      const iniciarEvaluacion = () => {
        if (!aprendizSeleccionado) return;

        // 1. Crucigrama: barajar los 45 conceptos en tiempo de ejecución y seleccionar 15
        const conceptosParaCrucigrama = barajarFisherYates(bancoConceptos45);
        const crucigramaGen = construirCrucigrama2D(conceptosParaCrucigrama);
        setDatosCrucigrama(crucigramaGen);
        setRespuestasCrucigrama({});

        // 2. Sopa de Letras: barajar los 45 conceptos en tiempo de ejecución y seleccionar 15
        const conceptosParaSopa = barajarFisherYates(bancoConceptos45);
        const sopaGen = construirSopaDeLetras18x18(conceptosParaSopa);
        setDatosSopa(sopaGen);
        setPalabrasEncontradasSopa([]);
        setPrimerClicSopa(null);

        // 3. Caso Práctico: barajar los 60 retos dinámicos y seleccionar 15
        const retosBarajados = barajarFisherYates(bancoRetos60).slice(0, 15);
        setRetosSeleccionados(retosBarajados);
        setRespuestasRetos({});

        // 4. Test Teórico: barajar las 60 preguntas únicas y seleccionar 25, barajando también sus opciones
        const preguntasBarajadas = barajarFisherYates(bancoPreguntas60)
          .slice(0, 25)
          .map((q) => ({
            ...q,
            opcionesMezcladas: barajarFisherYates(q.opciones)
          }));
        setPreguntasSeleccionadas(preguntasBarajadas);
        setRespuestasTest({});

        setEvaluacionIniciada(true);
        setEvaluacionFinalizada(false);
        setPestanaActiva("crucigrama");
      };

      const validarFormulaReto = (reto, entradaUsuario) => {
        if (!entradaUsuario) return { esValida: false, detalle: "Sin respuesta registrada." };
        const limpia = entradaUsuario.replace(/\s+/g, "").toUpperCase();

        if (!limpia.startsWith("=BUSCARV(") && !limpia.startsWith("=CONSULTAV(")) {
          return {
            esValida: false,
            detalle: "La fórmula debe iniciar con =BUSCARV( o =CONSULTAV(."
          };
        }
        if (!limpia.endsWith(")")) {
          return {
            esValida: false,
            detalle: "La fórmula debe cerrar con paréntesis ')'."
          };
        }
        if (!limpia.includes(";")) {
          return {
            esValida: false,
            detalle: "Los argumentos deben separarse obligatoriamente con punto y coma (;)."
          };
        }

        const inicioArgs = limpia.indexOf("(") + 1;
        const interior = limpia.slice(inicioArgs, -1);
        const partes = interior.split(";");
        if (partes.length !== 4) {
          return {
            esValida: false,
            detalle: "La función requiere exactamente 4 argumentos separados por punto y coma (;)."
          };
        }

        const [argValor, argMatriz, argCol, argOrden] = partes;
        const valorLimpiado = argValor.replace(/\$/g, "");
        if (valorLimpiado !== reto.celdaBuscada.toUpperCase()) {
          return {
            esValida: false,
            detalle: `El primer argumento (valor_buscado) debe hacer referencia a la celda ${reto.celdaBuscada}.`
          };
        }

        // Validación estricta de referencias absolutas ($) y hoja si aplica
        const matrizSinComillas = argMatriz.replace(/'/g, "");
        const matrizEsperada = reto.esHojaExterna
          ? `${reto.hoja}!${reto.rangoAbsoluto}`
          : reto.rangoAbsoluto;

        if (!matrizSinComillas.includes("$")) {
          return {
            esValida: false,
            detalle: "Es obligatorio fijar la matriz de búsqueda utilizando referencias absolutas ($)."
          };
        }

        if (matrizSinComillas !== matrizEsperada) {
          return {
            esValida: false,
            detalle: `La matriz de búsqueda con referencias absolutas debe ser ${matrizEsperada}.`
          };
        }

        if (argCol !== reto.colIndicador) {
          return {
            esValida: false,
            detalle: `El indicador de columnas debe ser ${reto.colIndicador}.`
          };
        }

        if (!reto.validosOrden.includes(argOrden)) {
          return {
            esValida: false,
            detalle: `El parámetro de ordenación debe ser ${reto.validosOrden.join(" o ")}.`
          };
        }

        return { esValida: true, detalle: "Fórmula estructurada correctamente con referencias absolutas." };
      };

      const manejarClicCeldaSopa = (fila, col) => {
        if (!primerClicSopa) {
          setPrimerClicSopa({ fila, col });
          return;
        }

        const f1 = primerClicSopa.fila;
        const c1 = primerClicSopa.col;
        const f2 = fila;
        const c2 = col;

        // Buscar si coincide con el inicio y fin (o viceversa) de alguna palabra de la sopa
        const encontrada = datosSopa.palabrasSopa.find(
          (p) =>
            (p.fIni === f1 && p.cIni === c1 && p.fFin === f2 && p.cFin === c2) ||
            (p.fIni === f2 && p.cIni === c2 && p.fFin === f1 && p.cFin === c1)
        );

        if (encontrada && !palabrasEncontradasSopa.includes(encontrada.palabra)) {
          setPalabrasEncontradasSopa([...palabrasEncontradasSopa, encontrada.palabra]);
        }
        setPrimerClicSopa(null);
      };

      const calcularResultados = () => {

            aciertosSopa: 0,
            notaSopa: 0,

            aciertosTest: 0,
            notaTest: 0,
            notaDefinitiva: 0

        }

        // 1. Crucigrama (15%) - Sanitización obligatoria .trim().toUpperCase() (Regla Anti-Error #6)
        let aciertosCrucigrama = 0;
        datosCrucigrama.palabras.forEach((item) => {
          const respUsuario = (respuestasCrucigrama[item.num] || "").trim().toUpperCase();
          if (respUsuario === item.palabra.trim().toUpperCase()) {
            aciertosCrucigrama++;
          }

        const notaCrucigrama = (aciertosCrucigrama / 15) * 15;

        // 2. Sopa de Letras (15%)
        const aciertosSopa = palabrasEncontradasSopa.length;
        const notaSopa = (aciertosSopa / 15) * 15;

        // 3. Caso Práctico (35%)
        let aciertosRetos = 0;
        retosSeleccionados.forEach((reto) => {
          const res = validarFormulaReto(reto, respuestasRetos[reto.id] || "");
          if (res.esValida) aciertosRetos++;

        const notaRetos = (aciertosRetos / 15) * 35;

        // 4. Test Teórico (35%)
        let aciertosTest = 0;
        preguntasSeleccionadas.forEach((preg) => {
          if (respuestasTest[preg.id] === preg.correcta) {
            aciertosTest++;
          }
        });
        const notaTest = (aciertosTest / 25) * 35;

        const notaDefinitiva = notaCrucigrama + notaSopa + notaRetos + notaTest;

        return {
          aciertosCrucigrama,
          notaCrucigrama,
          aciertosSopa,
          notaSopa,
          aciertosRetos,
          notaRetos,
          aciertosTest,
          notaTest,
          notaDefinitiva

            if (rf < N && rc < N) {

              if (k === 0) {

        return (

                return (

                        {celda.numInicio}
                      </span>
                    )}
                    <span className="mt-1">{celda.letraUsuario}</span>
                  </div>
                );
              })
            )}
          </div>
        );
      };

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                  {datosCrucigrama.palabras.map((p) => {

                  {retosSeleccionados.map((r, idx) => {
                    const usr = respuestasRetos[r.id] || "";
                    const val = validarFormulaReto(r, usr);
                    return (
                      <div
                        key={r.id}
                        className={`p-2.5 rounded border ${
                          val.esValida ? "bg-green-50 border-green-300" : "bg-red-50 border-red-300"
                        }`}
                      >
                        <div className="font-semibold text-slate-800">
                          Reto {idx + 1}: {r.enunciado}
                        </div>
                        <div className="mt-1">
                          <strong>Respuesta registrada:</strong>{" "}
                          <code className="bg-white px-1.5 py-0.5 rounded border">
                            {usr || "(Sin respuesta)"}
                          </code>{" "}
                          | <strong>Solución esperada:</strong>{" "}
                          <code className="bg-white px-1.5 py-0.5 rounded border text-senaDarkGreen">
                            {r.solucionMuestra}
                          </code>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          <header className="bg-senaDarkBlue text-white shadow-md border-b-4 border-senaGreen sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="bg-white p-1.5 rounded-lg">
                  <LogoSena className="w-9 h-9" />
                </div>
                <div>
                  <h1 className="text-base md:text-lg font-bold leading-tight">
                    EVALUACIÓN DUA: INTERFAZ DE EXCEL
                  </h1>
                  <p className="text-xs text-slate-300">
                    Aprendiz: <strong>{aprendizSeleccionado.nombres} {aprendizSeleccionado.apellidos}</strong> | ID: <strong>{aprendizSeleccionado.id}</strong> | Ficha: <strong>{aprendizSeleccionado.ficha}</strong>
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setMostrarVideo(!mostrarVideo)}
                  className="bg-senaPurple hover:bg-purple-800 text-white text-xs font-bold px-3.5 py-2 rounded-lg shadow transition"
                >
                  {mostrarVideo ? "Ocultar Recurso Audiovisual" : "Ver Video de Apoyo DUA"}
                </button>
                <button
                  onClick={() => setModalConfirmarEntrega(true)}
                  className="bg-senaGreen hover:bg-senaDarkGreen text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition"
                >
                  Finalizar y Calificar Evaluación
                </button>
              </div>
            </div>

            <div className="bg-slate-900/60 border-t border-slate-700">
              <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-2 py-2">
                <button
                  onClick={() => setPestanaActiva("crucigrama")}
                  className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    pestanaActiva === "crucigrama"
                      ? "bg-senaGreen text-white shadow"
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  1. Crucigrama 2D (15%)
                </button>
                <button
                  onClick={() => setPestanaActiva("sopa")}
                  className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    pestanaActiva === "sopa"
                      ? "bg-senaGreen text-white shadow"
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  2. Sopa de Letras 18x18 (15%) - [{palabrasEncontradasSopa.length}/15]
                </button>
                <button
                  onClick={() => setPestanaActiva("casos")}
                  className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    pestanaActiva === "casos"
                      ? "bg-senaGreen text-white shadow"
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  3. Caso Práctico (35%) - [{Object.keys(respuestasRetos).filter(k => (respuestasRetos[k] || "").trim() !== "").length}/15]
                </button>
                <button
                  onClick={() => setPestanaActiva("test")}
                  className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    pestanaActiva === "test"
                      ? "bg-senaGreen text-white shadow"
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  4. Test Teórico (35%) - [{Object.keys(respuestasTest).length}/25]
                </button>
              </div>
            </div>
          </header>

          {mostrarVideo && (
            <div className="bg-slate-900 text-white py-4 px-4 border-b border-slate-700">
              <div className="max-w-4xl mx-auto space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase text-senaGreen">
                    Material Audiovisual de Apoyo (Diseño Universal para el Aprendizaje)
                  </span>
                  <a
                    href="https://www.youtube.com/watch?v=PAhm2LyzZc4"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-xs underline text-slate-300 hover:text-white"
                  >
                    Abrir enlace directo en YouTube
                  </a>
                </div>
                <div className="aspect-video w-full rounded-xl overflow-hidden border border-slate-700 bg-black">
                  <iframe
                    className="w-full h-full"
                    src="https://www.youtube.com/embed/PAhm2LyzZc4"
                    title="Recurso Audiovisual Interfaz de Excel"
                    frameBorder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowFullScreen
                  ></iframe>
                </div>
              </div>
            </div>
          )}

          {}
          <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
            {pestanaActiva === "crucigrama" && datosCrucigrama && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow border border-slate-200">
                  <h2 className="text-lg font-bold text-senaDarkBlue">
                    Módulo 1: Crucigrama de Conceptos de la Interfaz de Excel (Ponderación: 15%)
                  </h2>
                  <p className="text-xs text-slate-600 mt-1">
                    Lea las 15 pistas seleccionadas al azar en el panel derecho y digite la palabra correspondiente en cada campo de captura. La cuadrícula de la izquierda reflejará automáticamente las letras en modo de solo lectura.
                  </p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  <div className="lg:col-span-7 bg-white p-4 rounded-2xl shadow border border-slate-200 overflow-x-auto">
                    {renderizarCuadriculaCrucigrama()}
                  </div>

                  <div className="lg:col-span-5 bg-white p-5 rounded-2xl shadow border border-slate-200 max-h-[680px] overflow-y-auto space-y-4">
                    <h3 className="text-sm font-bold uppercase text-senaDarkGreen border-b pb-2">
                      Panel de Pistas y Captura Sincronizada (15 Conceptos)
                    </h3>
                    {datosCrucigrama.palabras.map((item) => {
                      const actual = (respuestasCrucigrama[item.num] || "").trim().toUpperCase();
                      const longitudCompleta = actual.length === item.palabra.length;
                      return (
                        <div
                          key={item.num}
                          className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2"
                        >
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-extrabold text-senaPurple uppercase">
                              #{item.num} - {item.dir === "H" ? "Horizontal" : "Vertical"} ({item.palabra.length} letras)
                            </span>
                            <span
                              className={`text-[11px] font-bold px-2 py-0.5 rounded ${
                                longitudCompleta
                                  ? "bg-senaGreen/20 text-senaDarkGreen"
                                  : "bg-slate-200 text-slate-600"
                              }`}
                            >
                              {actual.length}/{item.palabra.length}
                            </span>
                          </div>
                          <p className="text-xs text-slate-700">{item.pista}</p>
                          <input
                            type="text"
                            maxLength={item.palabra.length}
                            value={respuestasCrucigrama[item.num] || ""}
                            onChange={(e) =>
                              setRespuestasCrucigrama({
                                ...respuestasCrucigrama,
                                [item.num]: e.target.value.toUpperCase()
                              })
                            }
                            placeholder={`Digite término de ${item.palabra.length} letras...`}
                            className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold uppercase tracking-wider focus:outline-none focus:border-senaGreen"
                          />
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {pestanaActiva === "sopa" && datosSopa && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow border border-slate-200">
                  <h2 className="text-lg font-bold text-senaDarkBlue">
                    Módulo 2: Sopa de Letras Accesible 18x18 (Ponderación: 15%)
                  </h2>
                  <p className="text-xs text-slate-600 mt-1">
                    Las palabras se ubican únicamente en sentido horizontal (de izquierda a derecha) y vertical (de arriba hacia abajo). Utilice el método de <strong>Dos Clics</strong>: haga un primer clic sobre la letra inicial de la palabra y un segundo clic sobre su letra final.
                  </p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  <div className="lg:col-span-7 bg-white p-5 rounded-2xl shadow border border-slate-200 overflow-x-auto">
                    <div
                      className="grid gap-1 mx-auto"
                      style={{
                        gridTemplateColumns: `repeat(${datosSopa.TAM}, minmax(26px, 32px))`,
                        width: "fit-content"
                      }}
                    >
                      {datosSopa.matriz.map((filaArr, fIdx) =>
                        filaArr.map((letra, cIdx) => {
                          const esPrimerClic =
                            primerClicSopa &&
                            primerClicSopa.fila === fIdx &&
                            primerClicSopa.col === cIdx;

                          // Verificar si la celda pertenece a alguna palabra ya encontrada
                          const perteneceEncontrada = datosSopa.palabrasSopa.some((p) => {
                            if (!palabrasEncontradasSopa.includes(p.palabra)) return false;
                            if (p.dir === "H") {
                              return fIdx === p.fIni && cIdx >= p.cIni && cIdx <= p.cFin;
                            } else {
                              return cIdx === p.cIni && fIdx >= p.fIni && fIdx <= p.fFin;
                            }
                          });

                          return (
                            <button
                              key={`${fIdx}-${cIdx}`}
                              type="button"
                              onClick={() => manejarClicCeldaSopa(fIdx, cIdx)}
                              className={`w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs flex items-center justify-center border transition ${
                                esPrimerClic
                                  ? "bg-senaPurple text-white border-senaPurple scale-105 shadow"
                                  : perteneceEncontrada
                                  ? "bg-senaGreen text-white border-senaDarkGreen"
                                  : "bg-slate-50 text-senaDarkBlue border-slate-300 hover:bg-slate-200"
                              }`}
                            >
                              {letra}
                            </button>
                          );
                        })
                      )}
                    </div>
                  </div>

                  {/* REGLA ANTI-ERROR #2: Listado de palabras 100% visible desde el inicio sin enmascarar */}
                  <div className="lg:col-span-5 bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-4">
                    <div className="flex items-center justify-between border-b pb-2">
                      <h3 className="text-sm font-bold uppercase text-senaDarkGreen">
                        Palabras a Buscar (100% Visibles)
                      </h3>
                      <span className="text-xs font-bold bg-senaDarkBlue text-white px-2.5 py-1 rounded-full">
                        {palabrasEncontradasSopa.length} / 15 Encontradas
                      </span>
                    </div>
                    <div className="space-y-2.5 max-h-[560px] overflow-y-auto pr-1">
                      {datosSopa.palabrasSopa.map((item) => {
                        const hallada = palabrasEncontradasSopa.includes(item.palabra);
                        return (
                          <div
                            key={item.id}
                            className={`p-3 rounded-xl border transition ${
                              hallada
                                ? "bg-green-50 border-senaGreen"
                                : "bg-slate-50 border-slate-200"
                            }`}
                          >
                            <div className="flex items-center justify-between">
                              <span
                                className={`text-sm font-extrabold tracking-wide ${
                                  hallada ? "text-senaDarkGreen line-through" : "text-senaDarkBlue"
                                }`}
                              >
                                {item.palabra}
                              </span>
                              <span
                                className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${
                                  hallada
                                    ? "bg-senaGreen text-white"
                                    : "bg-slate-200 text-slate-700"
                                }`}
                              >
                                {hallada ? "Localizada" : "Pendiente"}
                              </span>
                            </div>
                            <p className="text-xs text-slate-600 mt-1">{item.pista}</p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {}
            {pestanaActiva === "casos" && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow border border-slate-200">
                  <h2 className="text-lg font-bold text-senaDarkBlue">
                    Módulo 3: Caso Práctico en el Cuadro de Entrada de Fórmulas (Ponderación: 35%)
                  </h2>
                  <p className="text-xs text-slate-600 mt-1">
                    Resuelva los 15 retos seleccionados al azar del banco de 60 casos dinámicos. Utilice el signo igual (<code>=</code>), separe los argumentos con punto y coma (<code>;</code>) y fije obligatoriamente el rango de la matriz de búsqueda mediante referencias absolutas (<code>$</code>).
                  </p>
                </div>

                <div className="grid grid-cols-1 gap-4">
                  {retosSeleccionados.map((reto, index) => {
                    const valorActual = respuestasRetos[reto.id] || "";
                    return (
                      <div
                        key={reto.id}
                        className="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-extrabold uppercase bg-senaDarkBlue text-white px-3 py-1 rounded-full">
                            Reto Técnico #{index + 1} de 15
                          </span>
                          <span className="text-xs font-semibold text-senaGrayGreen">
                            {reto.esHojaExterna ? `Búsqueda en hoja externa (${reto.hoja})` : "Búsqueda en hoja activa"}
                          </span>
                        </div>
                        <p className="text-sm text-slate-800 leading-relaxed">{reto.enunciado}</p>
                        <div className="flex items-center space-x-2 bg-slate-100 p-2 rounded-xl border border-slate-300">
                          <span className="px-2.5 py-1 bg-white border border-slate-300 rounded text-xs font-bold text-senaDarkBlue select-none">
                            fx
                          </span>
                          <input
                            type="text"
                            value={valorActual}
                            onChange={(e) =>
                              setRespuestasRetos({
                                ...respuestasRetos,
                                [reto.id]: e.target.value
                              })
                            }
                            placeholder="Ejemplo: =BUSCARV(A2;Hoja!$A$2:$F$85;3;FALSO)"
                            className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono text-slate-800 focus:outline-none focus:border-senaGreen"
                          />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {pestanaActiva === "test" && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow border border-slate-200">
                  <h2 className="text-lg font-bold text-senaDarkBlue">
                    Módulo 4: Test Teórico sobre la Interfaz de Excel (Ponderación: 35%)
                  </h2>
                  <p className="text-xs text-slate-600 mt-1">
                    Seleccione la respuesta correcta para cada una de las 25 preguntas seleccionadas aleatoriamente del banco maestro de 60 preguntas únicas basadas en el marco teórico.
                  </p>
                </div>

                <div className="space-y-4">
                  {preguntasSeleccionadas.map((item, idx) => (
                    <div
                      key={item.id}
                      className="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3"
                    >
                      <div className="flex items-start space-x-3">
                        <span className="bg-senaPurple text-white text-xs font-extrabold px-2.5 py-1 rounded-lg shrink-0">
                          Pregunta {idx + 1}
                        </span>
                        <h3 className="text-sm font-bold text-senaDarkBlue leading-snug">
                          {item.pregunta}
                        </h3>
                      </div>

                      <div className="grid grid-cols-1 gap-2 pt-1">
                        {item.opcionesMezcladas.map((opcion, oIdx) => {
                          const marcada = respuestasTest[item.id] === opcion;
                          return (
                            <label
                              key={oIdx}
                              onClick={() =>
                                setRespuestasTest({
                                  ...respuestasTest,
                                  [item.id]: opcion
                                })
                              }
                              className={`flex items-center space-x-3 p-3 rounded-xl border text-xs cursor-pointer transition ${
                                marcada
                                  ? "bg-senaGreen/15 border-senaGreen font-bold text-senaDarkBlue"
                                  : "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100"
                              }`}
                            >
                              <input
                                type="radio"
                                name={`pregunta_${item.id}`}
                                checked={marcada}
                                onChange={() => {}}
                                className="accent-senaGreen"
                              />
                              <span>{opcion}</span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Modal personalizado de confirmación (sin usar alert/confirm nativos) */}
          {modalConfirmarEntrega && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white max-w-md w-full rounded-2xl shadow-2xl border border-slate-200 p-6 space-y-4">
                <h3 className="text-lg font-bold text-senaDarkBlue">
                  Confirmar Entrega de Evaluación
                </h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  ¿Está seguro de finalizar y calificar la evaluación sobre la Interfaz de Excel? Una vez confirmada la entrega, se generará el reporte oficial de calificación listo para descargar en PDF.
                </p>
                <div className="flex justify-end space-x-3 pt-2">
                  <button
                    onClick={() => setModalConfirmarEntrega(false)}
                    className="px-4 py-2 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 hover:bg-slate-300"
                  >
                    Continuar Respondiendo
                  </button>
                  <button
                    onClick={confirmarFinalizacion}
                    className="px-4 py-2 rounded-lg text-xs font-bold bg-senaGreen text-white hover:bg-senaDarkGreen shadow"
                  >
                    Confirmar y Calificar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
