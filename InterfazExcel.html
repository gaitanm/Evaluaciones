    /**
     * Algoritmo Fisher-Yates puro para barajado aleatorio sin sesgos (Regla Anti-Error #1)
     */
    function barajarFisherYates(arreglo) {
      const copia = [...arreglo];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copia[i];
        copia[i] = copia[j];
        copia[j] = temp;
      }
      return copia;
    }

      { id: 20, pregunta: "¿Qué elemento fundamental se muestra en el Cuadro de nombres situado a la izquierda de la barra de fórmulas?", opciones: ["La dirección o referencia de la celda activa (la celda seleccionada en ese momento).", "El nombre del usuario registrado en el sistema.", "El título del archivo o libro de trabajo guardado en el disco.", "El resultado de la suma rápida de todas las hojas del libro."], correcta: "La dirección o referencia de la celda activa (la celda seleccionada en ese momento)." },

      { id: 28, pregunta: "En la parte izquierda de la barra de estado, ¿qué indica explícitamente el mensaje 'Listo'?", opciones: ["Que no se está realizando ninguna acción y el programa está esperando la próxima instrucción.", "Que el documento ya fue enviado por correo electrónico satisfactoriamente.", "Que el usuario está editando activamente una fórmula dentro de una celda.", "Que la memoria de la hoja de cálculo ha alcanzado el límite de filas."], correcta: "Que no se está realizando ninguna acción y el programa está esperando la próxima instrucción." },

      { id: 33, pregunta: "¿Cuáles son las tres formas de ver el documento disponibles en los botones de 'Vista de página' de la barra de estado?", opciones: ["Vista Normal, Vista de Diseño de Página y Vista Previa de Salto de Página.", "Vista Aérea, Vista Tridimensional y Vista de Código Fuente.", "Vista Compacta, Vista Expandida y Vista de Pantalla Completa.", "Vista Preliminar, Vista de Fórmulas y Vista de Macros."], correcta: "Vista Normal, Vista de Diseño de Página y Vista Previa de Salto de Página." },

    function construirCrucigrama2D(conceptosBarajados) {
      const N = 22;
      const seleccionados = conceptosBarajados.slice(0, 15);
      // Garantizar mínimo 40% horizontal (7-8) y 40% vertical (7-8)
      const direcciones = [];
      for (let i = 0; i < 15; i++) {
        direcciones.push(i < 8 ? "H" : "V");
      }
      const dirMezcladas = barajarFisherYates(direcciones);

      const grid = Array.from({ length: N }, () => Array(N).fill(null));
      const palabrasColocadas = [];

      function puedeColocar(palabra, fila, col, dir) {
        if (dir === "H") {
          if (col + palabra.length > N) return false;
          if (col > 0 && grid[fila][col - 1] !== null) return false;
          if (col + palabra.length < N && grid[fila][col + palabra.length] !== null) return false;
          for (let k = 0; k < palabra.length; k++) {
            const actual = grid[fila][col + k];
            if (actual !== null && actual !== palabra[k]) return false;
            if (actual === null) {
              if (fila > 0 && grid[fila - 1][col + k] !== null) return false;
              if (fila < N - 1 && grid[fila + 1][col + k] !== null) return false;
            }
          }
          return true;
        } else {
          if (fila + palabra.length > N) return false;
          if (fila > 0 && grid[fila - 1][col] !== null) return false;
          if (fila + palabra.length < N && grid[fila + palabra.length][col] !== null) return false;
          for (let k = 0; k < palabra.length; k++) {
            const actual = grid[fila + k][col];
            if (actual !== null && actual !== palabra[k]) return false;
            if (actual === null) {
              if (col > 0 && grid[fila + k][col - 1] !== null) return false;
              if (col < N - 1 && grid[fila + k][col + 1] !== null) return false;
            }
          }
          return true;
        }
      }

      seleccionados.forEach((item, idx) => {
        const palabra = item.palabra.toUpperCase();
        const dirPreferida = dirMezcladas[idx];
        let colocada = false;

        if (palabrasColocadas.length > 0) {
          for (const prev of palabrasColocadas) {
            if (colocada) break;
            const dirIntento = prev.dir === "H" ? "V" : "H";
            if (dirIntento !== dirPreferida) continue;
            for (let i = 0; i < palabra.length; i++) {
              if (colocada) break;
              for (let j = 0; j < prev.palabra.length; j++) {
                if (palabra[i] === prev.palabra[j]) {
                  const f = dirIntento === "V" ? prev.fila - i : prev.fila + j;
                  const c = dirIntento === "V" ? prev.col + j : prev.col - i;
                  if (f >= 0 && c >= 0 && puedeColocar(palabra, f, c, dirIntento)) {
                    for (let k = 0; k < palabra.length; k++) {
                      const rf = dirIntento === "V" ? f + k : f;
                      const rc = dirIntento === "H" ? c + k : c;
                      grid[rf][rc] = palabra[k];
                    }
                    palabrasColocadas.push({
                      num: idx + 1,
                      palabra,
                      pista: item.pista,
                      fila: f,
                      col: c,
                      dir: dirIntento
                    });
                    colocada = true;
                    break;
                  }
                }
              }
            }
          }
        }

        if (!colocada) {
          const ordenFilas = barajarFisherYates(Array.from({ length: N }, (_, i) => i));
          const ordenCols = barajarFisherYates(Array.from({ length: N }, (_, i) => i));
          for (const f of ordenFilas) {
            if (colocada) break;
            for (const c of ordenCols) {
              if (puedeColocar(palabra, f, c, dirPreferida)) {
                for (let k = 0; k < palabra.length; k++) {
                  const rf = dirPreferida === "V" ? f + k : f;
                  const rc = dirPreferida === "H" ? c + k : c;
                  grid[rf][rc] = palabra[k];
                }
                palabrasColocadas.push({
                  num: idx + 1,
                  palabra,
                  pista: item.pista,
                  fila: f,
                  col: c,
                  dir: dirPreferida
                });
                colocada = true;
                break;
              }
            }
          }
        }

        if (!colocada) {
          const dirAlt = dirPreferida === "H" ? "V" : "H";
          for (let f = 0; f < N && !colocada; f++) {
            for (let c = 0; c < N && !colocada; c++) {
              if (puedeColocar(palabra, f, c, dirAlt)) {
                for (let k = 0; k < palabra.length; k++) {
                  const rf = dirAlt === "V" ? f + k : f;
                  const rc = dirAlt === "H" ? c + k : c;
                  grid[rf][rc] = palabra[k];
                }
                palabrasColocadas.push({
                  num: idx + 1,
                  palabra,
                  pista: item.pista,
                  fila: f,
                  col: c,
                  dir: dirAlt
                });
                colocada = true;
              }
            }
          }
        }
      });

      return { N, palabras: palabrasColocadas };
    }

    function construirSopaDeLetras18x18(conceptosBarajados) {
      const TAM = 18;
      const candidatos = conceptosBarajados.filter(c => c.palabra.length <= 14).slice(0, 15);
      const matriz = Array.from({ length: TAM }, () => Array(TAM).fill(""));
      const ubicaciones = [];

      candidatos.forEach((item, idx) => {
        const palabra = item.palabra.toUpperCase();
        const dirs = barajarFisherYates(["H", "V"]);
        let puesta = false;

        for (const dir of dirs) {
          if (puesta) break;
          const filasDisp = barajarFisherYates(
            Array.from({ length: dir === "V" ? TAM - palabra.length + 1 : TAM }, (_, i) => i)
          );
          const colsDisp = barajarFisherYates(
            Array.from({ length: dir === "H" ? TAM - palabra.length + 1 : TAM }, (_, i) => i)
          );

          for (const f of filasDisp) {
            if (puesta) break;
            for (const c of colsDisp) {
              let valido = true;
              for (let k = 0; k < palabra.length; k++) {
                const rf = dir === "V" ? f + k : f;
                const rc = dir === "H" ? c + k : c;
                if (matriz[rf][rc] !== "" && matriz[rf][rc] !== palabra[k]) {
                  valido = false;
                  break;
                }
              }
              if (valido) {
                for (let k = 0; k < palabra.length; k++) {
                  const rf = dir === "V" ? f + k : f;
                  const rc = dir === "H" ? c + k : c;
                  matriz[rf][rc] = palabra[k];
                }
                const fFin = dir === "V" ? f + palabra.length - 1 : f;
                const cFin = dir === "H" ? c + palabra.length - 1 : c;
                ubicaciones.push({
                  id: idx + 1,
                  palabra,
                  pista: item.pista,
                  fIni: f,
                  cIni: c,
                  fFin,
                  cFin,
                  dir
                });
                puesta = true;
                break;
              }
            }
          }
        }
      });

      const alfabeto = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
      for (let f = 0; f < TAM; f++) {
        for (let c = 0; c < TAM; c++) {
          if (matriz[f][c] === "") {
            matriz[f][c] = alfabeto[Math.floor(Math.random() * alfabeto.length)];
          }
        }
      }

      return { TAM, matriz, palabrasSopa: ubicaciones };
    }

    function App() {
      const [aprendizSeleccionado, setAprendizSeleccionado] = useState(null);
      const [evaluacionIniciada, setEvaluacionIniciada] = useState(false);
      const [evaluacionFinalizada, setEvaluacionFinalizada] = useState(false);
      const [pestanaActiva, setPestanaActiva] = useState("crucigrama");
      const [mostrarVideo, setMostrarVideo] = useState(false);
      const [modalConfirmarEntrega, setModalConfirmarEntrega] = useState(false);

      // Estados de los 4 módulos generados en tiempo de ejecución
      const [datosCrucigrama, setDatosCrucigrama] = useState(null);
      const [respuestasCrucigrama, setRespuestasCrucigrama] = useState({});

      const [datosSopa, setDatosSopa] = useState(null);
      const [primerClicSopa, setPrimerClicSopa] = useState(null);
      const [palabrasEncontradasSopa, setPalabrasEncontradasSopa] = useState([]);

      const [retosSeleccionados, setRetosSeleccionados] = useState([]);
      const [respuestasRetos, setRespuestasRetos] = useState({});

      const [preguntasSeleccionadas, setPreguntasSeleccionadas] = useState([]);
      const [respuestasTest, setRespuestasTest] = useState({});

      const [fechaEntrega, setFechaEntrega] = useState("");
      const reporteRef = useRef(null);

      // Prevención de recargas accidentales (beforeunload)
      useEffect(() => {
        const manejarBeforeUnload = (e) => {
          if (evaluacionIniciada && !evaluacionFinalizada) {
            e.preventDefault();
            e.returnValue = "";
          }
        };
        window.addEventListener("beforeunload", manejarBeforeUnload);
        return () => window.removeEventListener("beforeunload", manejarBeforeUnload);
      }, [evaluacionIniciada, evaluacionFinalizada]);

      const iniciarEvaluacion = () => {
        if (!aprendizSeleccionado) return;

        // 1. Crucigrama: barajar los 45 conceptos y seleccionar 15
        const conceptosParaCrucigrama = barajarFisherYates(bancoConceptos45);
        const crucigramaGen = construirCrucigrama2D(conceptosParaCrucigrama);
        setDatosCrucigrama(crucigramaGen);
        setRespuestasCrucigrama({});

        // 2. Sopa de Letras: barajar los 45 conceptos y seleccionar 15
        const conceptosParaSopa = barajarFisherYates(bancoConceptos45);
        const sopaGen = construirSopaDeLetras18x18(conceptosParaSopa);
        setDatosSopa(sopaGen);
        setPalabrasEncontradasSopa([]);
        setPrimerClicSopa(null);

        // 3. Caso Práctico (Interfaz): barajar los 60 retos y seleccionar 15
        const retosBarajados = barajarFisherYates(bancoRetos60).slice(0, 15);
        setRetosSeleccionados(retosBarajados);
        setRespuestasRetos({});

        // 4. Test Teórico: barajar las 60 preguntas y seleccionar 25
        const preguntasBarajadas = barajarFisherYates(bancoPreguntas60)
          .slice(0, 25)
          .map((q) => ({
            ...q,
            opcionesMezcladas: barajarFisherYates(q.opciones)
          }));
        setPreguntasSeleccionadas(preguntasBarajadas);
        setRespuestasTest({});

        setEvaluacionIniciada(true);
        setEvaluacionFinalizada(false);
        setPestanaActiva("crucigrama");
      };

      // Nuevo validador estricto para el simulador de Interfaz (Sin fórmulas)
      const validarRetoInterfaz = (reto, entradaUsuario) => {
        if (!entradaUsuario) return { esValida: false, detalle: "Sin respuesta registrada." };
        // Limpiamos espacios extras y pasamos a mayúscula para estandarizar validación de atajos/comandos
        const limpia = entradaUsuario.replace(/\s+/g, "").toUpperCase();
        
        // Verificamos si la respuesta limpiada coincide con alguna de las opciones válidas del reto
        const esCorrecta = reto.validos.some(opcionValida => {
            const opcionLimpia = opcionValida.replace(/\s+/g, "").toUpperCase();
            return limpia === opcionLimpia;
        });

        if (esCorrecta) {
            return { esValida: true, detalle: "Comando o atajo registrado correctamente." };
        } else {
            return { esValida: false, detalle: "La acción o comando ingresado no corresponde a la configuración de la interfaz." };
        }
      };

      const manejarClicCeldaSopa = (fila, col) => {
        if (!primerClicSopa) {
          setPrimerClicSopa({ fila, col });
          return;
        }

        const f1 = primerClicSopa.fila;
        const c1 = primerClicSopa.col;
        const f2 = fila;
        const c2 = col;

        const encontrada = datosSopa.palabrasSopa.find(
          (p) =>
            (p.fIni === f1 && p.cIni === c1 && p.fFin === f2 && p.cFin === c2) ||
            (p.fIni === f2 && p.cIni === c2 && p.fFin === f1 && p.cFin === c1)
        );

        if (encontrada && !palabrasEncontradasSopa.includes(encontrada.palabra)) {
          setPalabrasEncontradasSopa([...palabrasEncontradasSopa, encontrada.palabra]);
        }
        setPrimerClicSopa(null);
      };

      const calcularResultados = () => {
        if (!datosCrucigrama || !datosSopa) {
          return {
            aciertosCrucigrama: 0, notaCrucigrama: 0,
            aciertosSopa: 0, notaSopa: 0,
            aciertosRetos: 0, notaRetos: 0,
            aciertosTest: 0, notaTest: 0,
            notaDefinitiva: 0
          };
        }

        // 1. Crucigrama (15%) - Sanitización obligatoria .trim().toUpperCase()
        let aciertosCrucigrama = 0;
        datosCrucigrama.palabras.forEach((item) => {
          const respUsuario = (respuestasCrucigrama[item.num] || "").trim().toUpperCase();
          if (respUsuario === item.palabra.trim().toUpperCase()) aciertosCrucigrama++;
        });
        const notaCrucigrama = (aciertosCrucigrama / 15) * 15;

        // 2. Sopa de Letras (15%)
        const aciertosSopa = palabrasEncontradasSopa.length;
        const notaSopa = (aciertosSopa / 15) * 15;

        // 3. Caso Práctico - Interfaz (35%)
        let aciertosRetos = 0;
        retosSeleccionados.forEach((reto) => {
          const res = validarRetoInterfaz(reto, respuestasRetos[reto.id] || "");
          if (res.esValida) aciertosRetos++;
        });
        const notaRetos = (aciertosRetos / 15) * 35;

        // 4. Test Teórico (35%)
        let aciertosTest = 0;
        preguntasSeleccionadas.forEach((preg) => {
          if (respuestasTest[preg.id] === preg.correcta) aciertosTest++;
        });
        const notaTest = (aciertosTest / 25) * 35;

        const notaDefinitiva = notaCrucigrama + notaSopa + notaRetos + notaTest;

        return {
          aciertosCrucigrama, notaCrucigrama,
          aciertosSopa, notaSopa,
          aciertosRetos, notaRetos,
          aciertosTest, notaTest,
          notaDefinitiva
        };
      };

      const confirmarFinalizacion = () => {
        const ahora = new Date();
        setFechaEntrega(ahora.toLocaleString("es-CO"));
        setModalConfirmarEntrega(false);
        setEvaluacionFinalizada(true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const descargarReportePDF = () => {
        if (!reporteRef.current || !aprendizSeleccionado) return;
        const elemento = reporteRef.current;
        const opciones = {
          margin: [10, 10, 10, 10],
          filename: `Reporte_DUA_Interfaz_Excel_${aprendizSeleccionado.id}.pdf`,
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
        };
        window.html2pdf().set(opciones).from(elemento).save();
      };

      const renderizarCuadriculaCrucigrama = () => {
        if (!datosCrucigrama) return null;
        const { N, palabras } = datosCrucigrama;

        const celdasMapa = Array.from({ length: N }, () =>
          Array.from({ length: N }, () => ({ activa: false, letraUsuario: "", numInicio: null }))
        );

        palabras.forEach((item) => {
          const textoIngresado = (respuestasCrucigrama[item.num] || "").trim().toUpperCase();
          for (let k = 0; k < item.palabra.length; k++) {
            const rf = item.dir === "V" ? item.fila + k : item.fila;
            const rc = item.dir === "H" ? item.col + k : item.col;
            if (rf < N && rc < N) {
              celdasMapa[rf][rc].activa = true;
              if (textoIngresado[k]) {
                celdasMapa[rf][rc].letraUsuario = textoIngresado[k];
              }
              // Regla Anti-Error #3
              if (k === 0) {
                celdasMapa[rf][rc].numInicio = celdasMapa[rf][rc].numInicio
                  ? `${celdasMapa[rf][rc].numInicio}/${item.num}`
                  : `${item.num}`;
              }
            }
          }
        });

        return (
          <div
            className="crossword-grid mx-auto overflow-auto shadow-inner"
            style={{
              gridTemplateColumns: `repeat(${N}, minmax(26px, 30px))`,
              maxWidth: "100%"
            }}
          >
            {celdasMapa.map((filaArr, fIdx) =>
              filaArr.map((celda, cIdx) => {
                if (!celda.activa) {
                  return (
                    <div
                      key={`${fIdx}-${cIdx}`}
                      className="w-7 h-7 bg-senaDarkBlue/90 rounded-[2px]"
                    />
                  );
                }
                // Regla Anti-Error #6 (Contenedores de solo lectura)
                return (
                  <div
                    key={`${fIdx}-${cIdx}`}
                    className="w-7 h-7 bg-white border border-slate-400 relative flex items-center justify-center font-bold text-senaDarkBlue text-xs select-none"
                  >
                    {celda.numInicio && (
                      <span className="absolute top-[1px] left-[2px] text-[8px] leading-none font-extrabold text-senaPurple">
                        {celda.numInicio}
                      </span>
                    )}
                    <span className="mt-1">{celda.letraUsuario}</span>
                  </div>
                );
              })
            )}
          </div>
        );
      };

      if (!evaluacionIniciada) {
        return (
          <div className="min-h-screen flex flex-col bg-slate-100">
            <header className="bg-senaDarkBlue text-white shadow-lg border-b-4 border-senaGreen">
              <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
                <div className="flex items-center space-x-4">
                  <div className="bg-white p-2 rounded-lg shadow">
                    <LogoSena className="w-12 h-12" />
                  </div>
                  <div>
                    <h1 className="text-xl md:text-2xl font-bold tracking-tight">
                      EVALUACIÓN INTERACTIVA DUA - INTERFAZ DE EXCEL
                    </h1>
                    <p className="text-xs md:text-sm text-slate-300">
                      Diseño Universal para el Aprendizaje | Entorno de Evaluación Seguro
                    </p>
                  </div>
                </div>
                <span className="hidden md:inline-block bg-senaGreen text-white text-xs font-bold px-3 py-1.5 rounded-full uppercase">
                  53 Aprendices Verificados
                </span>
              </div>
            </header>

            <main className="flex-grow flex items-center justify-center p-6">
              <div className="bg-white max-w-2xl w-full rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <div className="bg-gradient-to-r from-senaDarkGreen to-senaGrayGreen px-6 py-5 text-white">
                  <h2 className="text-lg font-bold">Identificación del Aprendiz</h2>
                  <p className="text-xs text-slate-100 mt-1">
                    Seleccione el documento de identidad en el listado desplegable para autocompletar los datos de registro e iniciar la prueba.
                  </p>
                </div>

                <div className="p-6 space-y-5">
                  <div>
                    <label className="block text-sm font-semibold text-senaDarkBlue mb-2">
                      Seleccionar Aprendiz (Ordenado por Documento de Identidad - ID):
                    </label>
                    <select
                      className="w-full border-2 border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-senaGreen bg-white text-slate-800"
                      value={aprendizSeleccionado ? aprendizSeleccionado.id : ""}
                      onChange={(e) => {
                        const encontrado = baseAprendices.find((a) => a.id === e.target.value);
                        setAprendizSeleccionado(encontrado || null);
                      }}
                    >
                      <option value="">-- Seleccione un número de identificación --</option>
                      {baseAprendices.map((ap) => (
                        <option key={ap.id} value={ap.id}>
                          {ap.id} - {ap.nombres} {ap.apellidos} (Ficha {ap.ficha})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">
                        Número de Identificación (ID)
                      </label>
                      <input
                        type="text"
                        readOnly
                        value={aprendizSeleccionado ? aprendizSeleccionado.id : ""}
                        placeholder="Autocompletado..."

                      />

                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">
                        Número de Ficha
                      </label>
                      <input
                        type="text"
                        readOnly
                        value={aprendizSeleccionado ? aprendizSeleccionado.ficha : ""}
                        placeholder="Autocompletado..."
                        className="w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 font-semibold cursor-not-allowed"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">
                        Nombres del Aprendiz
                      </label>
                      <input
                        type="text"
                        readOnly
                        value={aprendizSeleccionado ? aprendizSeleccionado.nombres : ""}
                        placeholder="Autocompletado..."
                        className="w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 font-semibold cursor-not-allowed"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">
                        Apellidos del Aprendiz
                      </label>
                      <input
                        type="text"
                        readOnly
                        value={aprendizSeleccionado ? aprendizSeleccionado.apellidos : ""}
                        placeholder="Autocompletado..."
                        className="w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 font-semibold cursor-not-allowed"
                      />
                    </div>
                  </div>

                  <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 text-xs text-slate-700 space-y-2">
                    <div className="font-bold text-senaDarkBlue uppercase">
                      Estructura y Ponderación de la Evaluación:
                    </div>
                    <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <li className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-senaGreen"></span>
                        <span><strong>Crucigrama 2D:</strong> 15 conceptos (15%)</span>
                      </li>
                      <li className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-senaPurple"></span>
                        <span><strong>Sopa de Letras 18x18:</strong> 15 términos (15%)</span>
                      </li>
                      <li className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-senaDarkGreen"></span>
                        <span><strong>Caso Práctico de Interfaz:</strong> 15 retos (35%)</span>
                      </li>
                      <li className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-senaDarkBlue"></span>
                        <span><strong>Test Teórico:</strong> 25 preguntas únicas (35%)</span>
                      </li>
                    </ul>
                  </div>

                  <button
                    disabled={!aprendizSeleccionado}
                    onClick={iniciarEvaluacion}
                    className={`w-full py-3 rounded-xl font-bold text-white shadow-md transition ${
                      aprendizSeleccionado
                        ? "bg-senaGreen hover:bg-senaDarkGreen cursor-pointer"
                        : "bg-slate-300 cursor-not-allowed"
                    }`}
                  >
                    Iniciar Evaluación Interactiva
                  </button>
                </div>
              </div>
            </main>
          </div>
        );
      }

      const resultados = calcularResultados();

      if (evaluacionFinalizada) {
        return (
          <div className="min-h-screen bg-slate-100 py-8 px-4">
            <div className="max-w-5xl mx-auto mb-6 flex flex-wrap items-center justify-between gap-4 no-print">
              <div className="flex items-center space-x-3">
                <LogoSena className="w-10 h-10" />
                <div>
                  <h1 className="text-lg font-bold text-senaDarkBlue">
                     Evaluación Finalizada - Reporte de Calificación
                  </h1>
                  <p className="text-xs text-slate-600">
                    El aprendiz puede descargar el informe detallado en formato PDF.
                  </p>
                </div>
              </div>
              <div className="flex space-x-3">
                <button
                  onClick={descargarReportePDF}
                  className="bg-senaGreen hover:bg-senaDarkGreen text-white font-bold px-5 py-2.5 rounded-xl shadow transition text-sm"
                >
                  Descargar Reporte en PDF
                </button>
                <button
                  onClick={() => {
                    setEvaluacionIniciada(false);
                    setEvaluacionFinalizada(false);
                    setAprendizSeleccionado(null);
                  }}
                  className="bg-senaDarkBlue hover:bg-slate-800 text-white font-semibold px-4 py-2.5 rounded-xl shadow transition text-sm"
                >
                  Salir al Inicio
                </button>
              </div>
            </div>

            <div
              ref={reporteRef}
              className="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-8 space-y-6 text-slate-800"
            >
              <div className="flex items-center justify-between border-b-4 border-senaGreen pb-4">
                <div className="flex items-center space-x-4">
                  <LogoSena className="w-14 h-14" />
                  <div>
                    <h2 className="text-xl font-extrabold text-senaDarkBlue">
                      REPORTE OFICIAL DE EVALUACIÓN DUA
                    </h2>
                    <p className="text-sm font-semibold text-senaDarkGreen">
                      Tema Central: Interfaz de Excel (Atajos, Gestión y Navegación)
                    </p>
                    <p className="text-xs text-slate-500">Fecha de generación: {fechaEntrega}</p>
                  </div>
                </div>
                <div className="text-right bg-senaDarkBlue text-white px-5 py-3 rounded-xl">
                  <div className="text-xs uppercase tracking-wider text-slate-300">
                    Calificación Final
                  </div>
                  <div className="text-3xl font-extrabold text-senaGreen">
                    {resultados.notaDefinitiva.toFixed(2)} / 100
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                <div>
                  <span className="text-slate-500 block uppercase font-bold">Identificación (ID)</span>
                  <span className="text-sm font-bold text-senaDarkBlue">{aprendizSeleccionado.id}</span>
                </div>
                <div>
                  <span className="text-slate-500 block uppercase font-bold">Nombres</span>
                  <span className="text-sm font-bold text-senaDarkBlue">{aprendizSeleccionado.nombres}</span>
                </div>
                <div>
                  <span className="text-slate-500 block uppercase font-bold">Apellidos</span>
                  <span className="text-sm font-bold text-senaDarkBlue">{aprendizSeleccionado.apellidos}</span>
                </div>
                <div>
                  <span className="text-slate-500 block uppercase font-bold">Ficha</span>
                  <span className="text-sm font-bold text-senaPurple">{aprendizSeleccionado.ficha}</span>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="p-4 rounded-xl border-l-4 border-senaGreen bg-slate-50">
                  <div className="text-xs font-bold text-slate-500 uppercase">1. Crucigrama (15%)</div>
                  <div className="text-xl font-extrabold text-senaDarkBlue mt-1">
                    {resultados.notaCrucigrama.toFixed(2)}%
                  </div>
                  <div className="text-xs text-slate-600">
                    Aciertos: {resultados.aciertosCrucigrama} de 15
                  </div>
                </div>
                <div className="p-4 rounded-xl border-l-4 border-senaPurple bg-slate-50">
                  <div className="text-xs font-bold text-slate-500 uppercase">2. Sopa de Letras (15%)</div>
                  <div className="text-xl font-extrabold text-senaDarkBlue mt-1">
                    {resultados.notaSopa.toFixed(2)}%
                  </div>
                  <div className="text-xs text-slate-600">
                    Encontradas: {resultados.aciertosSopa} de 15
                  </div>
                </div>
                <div className="p-4 rounded-xl border-l-4 border-senaDarkGreen bg-slate-50">
                  <div className="text-xs font-bold text-slate-500 uppercase">3. Caso Práctico (35%)</div>
                  <div className="text-xl font-extrabold text-senaDarkBlue mt-1">
                    {resultados.notaRetos.toFixed(2)}%
                  </div>
                  <div className="text-xs text-slate-600">
                    Retos válidos: {resultados.aciertosRetos} de 15
                  </div>
                </div>
                <div className="p-4 rounded-xl border-l-4 border-senaDarkBlue bg-slate-50">
                  <div className="text-xs font-bold text-slate-500 uppercase">4. Test Teórico (35%)</div>
                  <div className="text-xl font-extrabold text-senaDarkBlue mt-1">
                    {resultados.notaTest.toFixed(2)}%
                  </div>
                  <div className="text-xs text-slate-600">
                    Respuestas correctas: {resultados.aciertosTest} de 25
                  </div>
                </div>
              </div>

              <div className="space-y-3">
                <h3 className="text-sm font-bold uppercase text-senaDarkBlue border-b pb-1">
                  Resumen de Crucigrama (15 Conceptos Evaluados)
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                  {datosCrucigrama.palabras.map((p) => {
                    const resp = (respuestasCrucigrama[p.num] || "").trim().toUpperCase();
                    const ok = resp === p.palabra.trim().toUpperCase();
                    return (
                      <div
                        key={p.num}
                        className={`p-2 rounded border ${
                          ok ? "bg-green-50 border-green-300" : "bg-red-50 border-red-300"
                        }`}
                      >
                        <span className="font-bold">#{p.num} ({p.dir}): </span>
                        <span> Respuesta ingresada: {resp || "(Vacío)"} | </span>
                        <span className={`font-semibold ${ok ? "text-senaDarkGreen" : "text-red-600"}`}>
                          Estado: {ok ? "Correcto" : "Incorrecto"}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="space-y-3">
                <h3 className="text-sm font-bold uppercase text-senaDarkBlue border-b pb-1">
                  Resumen de Caso Práctico - Interfaz (15 Retos Evaluados)
                </h3>
                <div className="space-y-2 text-xs">
                  {retosSeleccionados.map((r, idx) => {
                    const usr = respuestasRetos[r.id] || "";
                    const val = validarRetoInterfaz(r, usr);
                    return (
                      <div
                        key={r.id}
                        className={`p-2.5 rounded border ${
                          val.esValida ? "bg-green-50 border-green-300" : "bg-red-50 border-red-300"
                        }`}
                      >
                        <div className="font-semibold text-slate-800">
                          Reto {idx + 1}: {r.enunciado}
                        </div>
                        <div className="mt-1">
                          <strong>Respuesta registrada:</strong>{" "}
                          <code className="bg-white px-1.5 py-0.5 rounded border">
                            {usr || "(Sin respuesta)"}
                          </code>{" "}
                          | <strong>Validación:</strong>{" "}
                          <span className={`font-bold ${val.esValida ? "text-senaDarkGreen" : "text-red-600"}`}>
                            {val.esValida ? "Correcto" : "Incorrecto"}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          <header className="bg-senaDarkBlue text-white shadow-md border-b-4 border-senaGreen sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="bg-white p-1.5 rounded-lg">
                  <LogoSena className="w-9 h-9" />
                </div>
                <div>
                  <h1 className="text-base md:text-lg font-bold leading-tight">
                    EVALUACIÓN DUA: INTERFAZ DE EXCEL
                  </h1>
                  <p className="text-xs text-slate-300">
                    Aprendiz: <strong>{aprendizSeleccionado.nombres} {aprendizSeleccionado.apellidos}</strong> | ID: <strong>{aprendizSeleccionado.id}</strong> | Ficha: <strong>{aprendizSeleccionado.ficha}</strong>
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setMostrarVideo(!mostrarVideo)}
                  className="bg-senaPurple hover:bg-purple-800 text-white text-xs font-bold px-3.5 py-2 rounded-lg shadow transition"
                >
                  {mostrarVideo ? "Ocultar Recurso Audiovisual" : "Ver Video de Apoyo DUA"}
                </button>
                <button
                  onClick={() => setModalConfirmarEntrega(true)}
                  className="bg-senaGreen hover:bg-senaDarkGreen text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition"
                >
                  Finalizar y Calificar Evaluación
                </button>
              </div>
            </div>

            <div className="bg-slate-900/60 border-t border-slate-700">
              <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-2 py-2">
                <button
                  onClick={() => setPestanaActiva("crucigrama")}
                  className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    pestanaActiva === "crucigrama"
                      ? "bg-senaGreen text-white shadow"
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  1. Crucigrama 2D (15%)
                </button>
                <button
                  onClick={() => setPestanaActiva("sopa")}
                  className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    pestanaActiva === "sopa"
                      ? "bg-senaGreen text-white shadow"
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  2. Sopa de Letras 18x18 (15%) - [{palabrasEncontradasSopa.length}/15]
                </button>
                <button
                  onClick={() => setPestanaActiva("casos")}
                  className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    pestanaActiva === "casos"
                      ? "bg-senaGreen text-white shadow"
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  3. Caso Práctico (35%) - [{Object.keys(respuestasRetos).filter(k => (respuestasRetos[k] || "").trim() !== "").length}/15]
                </button>
                <button
                  onClick={() => setPestanaActiva("test")}
                  className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    pestanaActiva === "test"
                      ? "bg-senaGreen text-white shadow"
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  4. Test Teórico (35%) - [{Object.keys(respuestasTest).length}/25]
                </button>
              </div>
            </div>
          </header>

          {mostrarVideo && (
            <div className="bg-slate-900 text-white py-4 px-4 border-b border-slate-700">
              <div className="max-w-4xl mx-auto space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase text-senaGreen">
                    Material Audiovisual de Apoyo (Diseño Universal para el Aprendizaje)
                  </span>
                  <a
                    href="https://www.youtube.com/watch?v=PAhm2LyzZc4"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-xs underline text-slate-300 hover:text-white"
                  >
                    Abrir enlace directo en YouTube
                  </a>
                </div>
                <div className="aspect-video w-full rounded-xl overflow-hidden border border-slate-700 bg-black">
                  <iframe
                    className="w-full h-full"
                    src="https://www.youtube.com/embed/PAhm2LyzZc4"
                    title="Recurso Audiovisual Interfaz de Excel"
                    frameBorder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowFullScreen
                  ></iframe>
                </div>
              </div>
            </div>
          )}

          <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
            {pestanaActiva === "crucigrama" && datosCrucigrama && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow border border-slate-200">
                  <h2 className="text-lg font-bold text-senaDarkBlue">
                    Módulo 1: Crucigrama de Conceptos de la Interfaz (Ponderación: 15%)
                  </h2>
                  <p className="text-xs text-slate-600 mt-1">
                    Lea las pistas en el panel derecho y digite la palabra correspondiente. La cuadrícula reflejará las letras ingresadas de forma segura.
                  </p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  <div className="lg:col-span-7 bg-white p-4 rounded-2xl shadow border border-slate-200 overflow-x-auto">
                    {renderizarCuadriculaCrucigrama()}
                  </div>

                  <div className="lg:col-span-5 bg-white p-5 rounded-2xl shadow border border-slate-200 max-h-[680px] overflow-y-auto space-y-4">
                    <h3 className="text-sm font-bold uppercase text-senaDarkGreen border-b pb-2">
                      Panel de Pistas y Captura (15 Conceptos)
                    </h3>
                    {datosCrucigrama.palabras.map((item) => {
                      const actual = (respuestasCrucigrama[item.num] || "").trim().toUpperCase();
                      const longitudCompleta = actual.length === item.palabra.length;
                      return (
                        <div
                          key={item.num}
                          className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2"
                        >
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-extrabold text-senaPurple uppercase">
                              #{item.num} - {item.dir === "H" ? "Horizontal" : "Vertical"} ({item.palabra.length} letras)
                            </span>
                            <span
                              className={`text-[11px] font-bold px-2 py-0.5 rounded ${
                                longitudCompleta
                                  ? "bg-senaGreen/20 text-senaDarkGreen"
                                  : "bg-slate-200 text-slate-600"
                              }`}
                            >
                              {actual.length}/{item.palabra.length}
                            </span>
                          </div>
                          <p className="text-xs text-slate-700">{item.pista}</p>
                          <input
                            type="text"
                            maxLength={item.palabra.length}
                            value={respuestasCrucigrama[item.num] || ""}
                            onChange={(e) =>
                              setRespuestasCrucigrama({
                                ...respuestasCrucigrama,
                                [item.num]: e.target.value.toUpperCase()
                              })
                            }
                            placeholder={`Digite término de ${item.palabra.length} letras...`}
                            className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold uppercase tracking-wider focus:outline-none focus:border-senaGreen"
                          />
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {pestanaActiva === "sopa" && datosSopa && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow border border-slate-200">
                  <h2 className="text-lg font-bold text-senaDarkBlue">
                    Módulo 2: Sopa de Letras Accesible 18x18 (Ponderación: 15%)
                  </h2>
                  <p className="text-xs text-slate-600 mt-1">
                    Las palabras se ubican en sentido horizontal y vertical. Utilice el método de <strong>Dos Clics</strong> (clic en letra inicial y clic en letra final).
                  </p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  <div className="lg:col-span-7 bg-white p-5 rounded-2xl shadow border border-slate-200 overflow-x-auto">
                    <div
                      className="grid gap-1 mx-auto"
                      style={{
                        gridTemplateColumns: `repeat(${datosSopa.TAM}, minmax(26px, 32px))`,
                        width: "fit-content"
                      }}
                    >
                      {datosSopa.matriz.map((filaArr, fIdx) =>
                        filaArr.map((letra, cIdx) => {
                          const esPrimerClic =
                            primerClicSopa &&
                            primerClicSopa.fila === fIdx &&
                            primerClicSopa.col === cIdx;

                          const perteneceEncontrada = datosSopa.palabrasSopa.some((p) => {
                            if (!palabrasEncontradasSopa.includes(p.palabra)) return false;
                            if (p.dir === "H") {
                              return fIdx === p.fIni && cIdx >= p.cIni && cIdx <= p.cFin;
                            } else {
                              return cIdx === p.cIni && fIdx >= p.fIni && fIdx <= p.fFin;
                            }
                          });

                          return (
                            <button
                              key={`${fIdx}-${cIdx}`}
                              type="button"
                              onClick={() => manejarClicCeldaSopa(fIdx, cIdx)}
                              className={`w-7 h-7 sm:w-8 sm:h-8 rounded font-bold text-xs flex items-center justify-center border transition ${
                                esPrimerClic
                                  ? "bg-senaPurple text-white border-senaPurple scale-105 shadow"
                                  : perteneceEncontrada
                                  ? "bg-senaGreen text-white border-senaDarkGreen"
                                  : "bg-slate-50 text-senaDarkBlue border-slate-300 hover:bg-slate-200"
                              }`}
                            >
                              {letra}
                            </button>
                          );
                        })
                      )}
                    </div>
                  </div>

                  <div className="lg:col-span-5 bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-4">
                    <div className="flex items-center justify-between border-b pb-2">
                      <h3 className="text-sm font-bold uppercase text-senaDarkGreen">
                        Palabras a Buscar (100% Visibles)
                      </h3>
                      <span className="text-xs font-bold bg-senaDarkBlue text-white px-2.5 py-1 rounded-full">
                        {palabrasEncontradasSopa.length} / 15 Encontradas
                      </span>
                    </div>
                    <div className="space-y-2.5 max-h-[560px] overflow-y-auto pr-1">
                      {datosSopa.palabrasSopa.map((item) => {
                        const hallada = palabrasEncontradasSopa.includes(item.palabra);
                        return (
                          <div
                            key={item.id}
                            className={`p-3 rounded-xl border transition ${
                              hallada
                                ? "bg-green-50 border-senaGreen"
                                : "bg-slate-50 border-slate-200"
                            }`}
                          >
                            <div className="flex items-center justify-between">
                              <span
                                className={`text-sm font-extrabold tracking-wide ${
                                  hallada ? "text-senaDarkGreen line-through" : "text-senaDarkBlue"
                                }`}
                              >
                                {item.palabra}
                              </span>
                              <span
                                className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${
                                  hallada
                                    ? "bg-senaGreen text-white"
                                    : "bg-slate-200 text-slate-700"
                                }`}
                              >
                                {hallada ? "Localizada" : "Pendiente"}
                              </span>
                            </div>
                            <p className="text-xs text-slate-600 mt-1">{item.pista}</p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {pestanaActiva === "casos" && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow border border-slate-200">
                  <h2 className="text-lg font-bold text-senaDarkBlue">
                    Módulo 3: Simulador de Interfaz y Navegación (Ponderación: 35%)
                  </h2>
                  <p className="text-xs text-slate-600 mt-1">
                    Resuelva los 15 retos técnicos seleccionados al azar simulando el ingreso de comandos, nombres de pestañas, atajos de teclado (usando el formato TECLA+TECLA), referencias de celdas o estados exactos requeridos por la interfaz.
                  </p>
                </div>

                <div className="grid grid-cols-1 gap-4">
                  {retosSeleccionados.map((reto, index) => {
                    const valorActual = respuestasRetos[reto.id] || "";
                    return (
                      <div
                        key={reto.id}
                        className="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-extrabold uppercase bg-senaDarkBlue text-white px-3 py-1 rounded-full">
                            Reto Técnico #{index + 1} de 15
                          </span>
                        </div>
                        <p className="text-sm text-slate-800 leading-relaxed font-medium">{reto.enunciado}</p>
                        <div className="flex items-center space-x-2 bg-slate-100 p-2 rounded-xl border border-slate-300">
                          <span className="px-3 py-1.5 bg-senaPurple border border-senaPurple rounded text-xs font-extrabold text-white shadow-sm select-none">
                            ACCIÓN / COMANDO &gt;_
                          </span>
                          <input
                            type="text"
                            value={valorActual}
                            onChange={(e) =>
                              setRespuestasRetos({
                                ...respuestasRetos,
                                [reto.id]: e.target.value
                              })
                            }
                            placeholder="Ingrese su respuesta (ej. CTRL+INICIO, GUARDAR, A1)"
                            className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold uppercase tracking-wider text-slate-800 focus:outline-none focus:border-senaGreen"
                          />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {pestanaActiva === "test" && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow border border-slate-200">
                  <h2 className="text-lg font-bold text-senaDarkBlue">
                    Módulo 4: Test Teórico sobre la Interfaz (Ponderación: 35%)
                  </h2>
                  <p className="text-xs text-slate-600 mt-1">
                    Seleccione la respuesta correcta para cada una de las 25 preguntas seleccionadas aleatoriamente del banco teórico.
                  </p>
                </div>

                <div className="space-y-4">
                  {preguntasSeleccionadas.map((item, idx) => (
                    <div
                      key={item.id}
                      className="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3"
                    >
                      <div className="flex items-start space-x-3">
                        <span className="bg-senaPurple text-white text-xs font-extrabold px-2.5 py-1 rounded-lg shrink-0">
                          Pregunta {idx + 1}
                        </span>
                        <h3 className="text-sm font-bold text-senaDarkBlue leading-snug">
                          {item.pregunta}
                        </h3>
                      </div>

                      <div className="grid grid-cols-1 gap-2 pt-1">
                        {item.opcionesMezcladas.map((opcion, oIdx) => {
                          const marcada = respuestasTest[item.id] === opcion;
                          return (
                            <label
                              key={oIdx}
                              onClick={() =>
                                setRespuestasTest({
                                  ...respuestasTest,
                                  [item.id]: opcion
                                })
                              }
                              className={`flex items-center space-x-3 p-3 rounded-xl border text-xs cursor-pointer transition ${
                                marcada
                                  ? "bg-senaGreen/15 border-senaGreen font-bold text-senaDarkBlue"
                                  : "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100"
                              }`}
                            >
                              <input
                                type="radio"
                                name={`pregunta_${item.id}`}
                                checked={marcada}
                                onChange={() => {}}
                                className="accent-senaGreen"
                              />
                              <span>{opcion}</span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {modalConfirmarEntrega && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white max-w-md w-full rounded-2xl shadow-2xl border border-slate-200 p-6 space-y-4">
                <h3 className="text-lg font-bold text-senaDarkBlue">
                  Confirmar Entrega de Evaluación
                </h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  ¿Está seguro de finalizar y calificar la evaluación sobre la Interfaz? Una vez confirmada la entrega, se generará el reporte oficial de calificación listo para descargar en PDF.
                </p>
                <div className="flex justify-end space-x-3 pt-2">
                  <button
                    onClick={() => setModalConfirmarEntrega(false)}
                    className="px-4 py-2 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 hover:bg-slate-300"
                  >
                    Continuar Respondiendo
                  </button>
                  <button
                    onClick={confirmarFinalizacion}
                    className="px-4 py-2 rounded-lg text-xs font-bold bg-senaGreen text-white hover:bg-senaDarkGreen shadow"
                  >
                    Confirmar y Calificar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
