            palabras.sort((a, b) => b.word.length - a.word.length);
            let grid = Array(30).fill(null).map(() => Array(30).fill(null));
            let placed = [];
            let horizCount = 0;
            let vertCount = 0;

            const placeFirst = (wordObj) => {
                const w = wordObj.word;
                const startX = 15 - Math.floor(w.length / 2);
                const startY = 15;
                for (let i = 0; i < w.length; i++) {
                    grid[startY][startX + i] = { char: w[i] };
                }
                grid[startY][startX].num = 1;
                grid[startY][startX].dir = 'H';
                
                placed.push({ ...wordObj, num: 1, x: startX, y: startY, dir: 'H' });
                horizCount++;
            };

            const canPlace = (w, r, c, dir) => {
                if (dir === 'H') {
                    if (c + w.length > 30) return false;
                    for (let i = 0; i < w.length; i++) {
                        if (grid[r][c + i] && grid[r][c + i].char !== w[i]) return false;
                        if (!grid[r][c + i]) {
                            if (r > 0 && grid[r-1][c+i]) return false;
                            if (r < 29 && grid[r+1][c+i]) return false;
                        }
                    }
                    if (c > 0 && grid[r][c-1]) return false;
                    if (c + w.length < 30 && grid[r][c+w.length]) return false;
                } else {
                    if (r + w.length > 30) return false;
                    for (let i = 0; i < w.length; i++) {
                        if (grid[r + i][c] && grid[r + i][c].char !== w[i]) return false;
                        if (!grid[r + i][c]) {
                            if (c > 0 && grid[r+i][c-1]) return false;
                            if (c < 29 && grid[r+i][c+1]) return false;
                        }
                    }
                    if (r > 0 && grid[r-1][c]) return false;
                    if (r + w.length < 30 && grid[r+w.length][c]) return false;
                }
                return true;
            };

            if (palabras.length > 0) placeFirst(palabras[0]);

            let counter = 2;
            for (let i = 1; i < palabras.length; i++) {
                const w = palabras[i].word;
                let isPlaced = false;
                
                let preferDir = null;
                if (i > 8) {
                    if (horizCount < 6) preferDir = 'H';
                    if (vertCount < 6) preferDir = 'V';
                }

                for (let p of placed) {
                    if (isPlaced) break;
                    for (let j = 0; j < p.word.length; j++) {
                        if (isPlaced) break;
                        const char = p.word[j];
                        const matchIdx = w.indexOf(char);
                        if (matchIdx !== -1) {
                            const tryDir = p.dir === 'H' ? 'V' : 'H';
                            if (preferDir && tryDir !== preferDir && (horizCount + vertCount < 14)) continue;
                            
                            const startR = p.dir === 'H' ? p.y - matchIdx : p.y + j;
                            const startC = p.dir === 'H' ? p.x + j : p.x - matchIdx;
                            
                            if (startR >= 0 && startC >= 0 && canPlace(w, startR, startC, tryDir)) {
                                for (let k = 0; k < w.length; k++) {
                                    const r = tryDir === 'V' ? startR + k : startR;
                                    const c = tryDir === 'H' ? startC + k : startC;
                                    if (!grid[r][c]) grid[r][c] = { char: w[k], shared: true };
                                }
                                grid[startR][startC].num = counter;
                                placed.push({ ...palabras[i], num: counter, x: startC, y: startR, dir: tryDir });
                                tryDir === 'H' ? horizCount++ : vertCount++;
                                isPlaced = true;
                                counter++;
                            }
                        }
                    }
                }
                
                if (!isPlaced) {
                    let dir = preferDir || (Math.random() > 0.5 ? 'H' : 'V');
                    outer: for(let r=2; r<28; r+=2) {
                        for(let c=2; c<28; c+=2) {
                            if (canPlace(w, r, c, dir)) {
                                for (let k = 0; k < w.length; k++) {
                                    if(dir === 'H') grid[r][c+k] = { char: w[k] };
                                    else grid[r+k][c] = { char: w[k] };
                                }
                                grid[r][c].num = counter;
                                placed.push({ ...palabras[i], num: counter, x: c, y: r, dir: dir });
                                dir === 'H' ? horizCount++ : vertCount++;
                                isPlaced = true;
                                counter++;
                                break outer;
                            }
                        }
                    }
                }
            }
            
            let minR=30, maxR=0, minC=30, maxC=0;
            for(let r=0; r<30; r++){
                for(let c=0; c<30; c++){
                    if(grid[r][c]){
                        if(r<minR) minR=r; if(r>maxR) maxR=r;
                        if(c<minC) minC=c; if(c>maxC) maxC=c;
                    }
                }
            }
            
            const trimmedGrid = grid.slice(minR, maxR+1).map(row => row.slice(minC, maxC+1));
            const adjustedPlaced = placed.map(p => ({...p, x: p.x - minC, y: p.y - minR}));
            
            return { grid: trimmedGrid, palabras: adjustedPlaced };
        };

        const generarSopa = (palabras) => {
            const size = 18;
            let grid = Array(size).fill(null).map(() => Array(size).fill(''));
            let placedInfo = [];
            const dirs = [[0,1], [1,0]]; 
            
            for(let p of palabras) {
                const w = p.word;
                let placed = false;
                let attempts = 0;
                while(!placed && attempts < 100) {
                    attempts++;
                    const d = dirs[Math.floor(Math.random() * dirs.length)];
                    const r = Math.floor(Math.random() * size);
                    const c = Math.floor(Math.random() * size);
                    
                    if (r + d[0]*w.length <= size && c + d[1]*w.length <= size) {
                        let can = true;
                        for(let i=0; i<w.length; i++) {
                            const char = grid[r + d[0]*i][c + d[1]*i];
                            if(char !== '' && char !== w[i]) { can = false; break; }
                        }
                        if(can) {
                            for(let i=0; i<w.length; i++) {
                                grid[r + d[0]*i][c + d[1]*i] = w[i];
                            }
                            placedInfo.push({word: w, start: [r,c], dir: d});
                            placed = true;
                        }
                    }
                }
            }
            
            const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    if(grid[r][c] === '') grid[r][c] = letras[Math.floor(Math.random()*letras.length)];
                }
            }
            return { grid, placedInfo };
        };

        const generarRetos = () => {
            const banco = [];
            const hojas = ["Datos", "Reportes", "Base", "Consolidado", "Liquidacion", ""]; 
            const tiposCoincidencia = [
                { desc: "coincidencia exacta", val: "FALSO" },
                { desc: "coincidencia aproximada", val: "VERDADERO" },
                { desc: "coincidencia exacta (usando 0)", val: "0" },
                { desc: "coincidencia aproximada (usando 1)", val: "1" }
            ];
            
            for (let e = 0; e < 60; e++) {
                const asciiStart = 65 + (e % 15);
                const startColChar = String.fromCharCode(asciiStart > 90 ? 90 : asciiStart);
                const asciiEnd = asciiStart + 3 + (e % 6);
                const endColChar = String.fromCharCode(asciiEnd > 90 ? 90 : asciiEnd);
                const startRow = (e * 4) + (e % 3 === 0 ? 2 : 5);
                const endRow = startRow + 40 + (e * 5);

                    ];
                    descripcion = plantillas[e % 3];
                }
                
                banco.push({

                            <div className="crossword-container" style={{ display: 'grid', gridTemplateColumns: `repeat(${data.grid[0].length}, 30px)` }}>
                                {data.grid.map((row, r) => row.map((cell, c) => (
                                    <div key={`${r}-${c}`} className={`grid-cell ${cell ? 'word' : 'empty'} relative`}>
                                        {cell && cell.num && <span className="number-badge">{cell.num}</span>}
                                        {cell && <span className="readonly-char">{getCellChar(r, c)}</span>}
                                    </div>
                                )))}
                            </div>
                            <div className="mt-4 text-sm text-gray-500 italic">* Utilice los campos de texto del panel derecho para responder. La grilla se llenará automáticamente.</div>
                        </div>
                        <div className="flex-1 space-y-4 max-h-[600px] overflow-y-auto pr-4">
                            <h3 className="font-bold text-institucional-azul text-lg border-b pb-2">Pistas</h3>
                            {data.palabras.sort((a,b)=>a.num - b.num).map(p => (
                                <div key={p.num} className="bg-white p-3 rounded shadow-sm border border-gray-200">
                                    <label className="block text-sm font-semibold mb-1 text-institucional-verdeGris">
                                        {p.num}. ({p.dir === 'H' ? 'Horizontal' : 'Vertical'}) {p.clue}
                                    </label>
                                    <input 
                                        type="text" 
                                        className="w-full border-b-2 border-institucional-verde focus:border-institucional-morado outline-none px-2 py-1 uppercase" 
                                        placeholder={`Palabra de ${p.word.length} letras`}
                                        value={rep[p.num] || ''}
                                        onChange={e => handleInput(p.num, e.target.value)}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="mt-8 text-right">
                        <button onClick={onNext} className="bg-institucional-azul hover:bg-institucional-verdeOscuro text-white font-bold py-2 px-8 rounded">Siguiente Actividad →</button>
                    </div>
                </div>
            );
        };

        const SopaLetras = ({ data, encontradas, setEncontradas, onNext }) => {
            const [selStart, setSelStart] = React.useState(null);

            const handleCellClick = (r, c) => {
                if (!selStart) {
                    setSelStart({r, c});
                } else {
                    const r1 = selStart.r, c1 = selStart.c;
                    const r2 = r, c2 = c;
                    setSelStart(null);
                    
                    if (r1 !== r2 && c1 !== c2) return; 
                    
                    const isH = r1 === r2;
                    const min = isH ? Math.min(c1, c2) : Math.min(r1, r2);
                    const max = isH ? Math.max(c1, c2) : Math.max(r1, r2);
                    const len = max - min + 1;
                    
                    let formedWord = "";
                    for(let i=0; i<len; i++){
                        formedWord += isH ? data.grid[r1][min+i] : data.grid[min+i][c1];
                    }
                    
                    const revWord = formedWord.split('').reverse().join('');

                    const match = data.placedInfo.find(p => (p.word === formedWord || p.word === revWord) && !encontradas.includes(p.word));
                    
                    if (match) {
                        const startMatched = (isH && min === match.start[1]) || (!isH && min === match.start[0]);
                        if(startMatched){
                             setEncontradas([...encontradas, match.word]);
                        }
                    }
                }
            };

            const isHighlighted = (r, c) => {
                if (selStart && selStart.r === r && selStart.c === c) return 'selected';
                for (let p of encontradas) {
                    const info = data.placedInfo.find(i => i.word === p);
                    if (info) {
                        const isH = info.dir[1] === 1;
                        if (isH && r === info.start[0] && c >= info.start[1] && c < info.start[1] + p.length) return 'found';
                        if (!isH && c === info.start[1] && r >= info.start[0] && r < info.start[0] + p.length) return 'found';
                    }
                }
                return '';
            };

            return (
                <div>
                    <h2 className="text-2xl font-bold text-institucional-morado mb-2">Actividad 2: Sopa de Letras (15%)</h2>
                    <p className="mb-6 text-gray-600">El aprendiz debe utilizar la técnica de "Dos Clics" (clic en inicial, clic en final) para seleccionar las {data.placedInfo.length} palabras ocultas (solo horizontal y vertical, no diagonales, no invertidas).</p>
                    
                    <div className="flex flex-col md:flex-row gap-8 items-start">
                        <div className="bg-white p-4 shadow border border-gray-200 rounded inline-block">
                            {data.grid.map((row, r) => (
                                <div key={r} className="flex">
                                    {row.map((char, c) => (
                                        <div 
                                            key={c} 
                                            onClick={() => handleCellClick(r, c)}
                                            className={`grid-cell sopa-cell ${isHighlighted(r, c)}`}
                                        >
                                            {char}
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                        <div className="flex-1">
                            <h3 className="font-bold text-institucional-azul text-lg border-b pb-2 mb-4">Palabras a buscar ({encontradas.length}/15)</h3>
                            <div className="flex flex-wrap gap-2">
                                {data.placedInfo.map((p, i) => (
                                    <span key={i} className={`px-3 py-1 rounded text-sm font-semibold border ${encontradas.includes(p.word) ? 'bg-institucional-verde text-white border-institucional-verde' : 'bg-gray-100 text-gray-700 border-gray-300'}`}>
                                        {p.word}
                                    </span>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="mt-8 text-right">
                        <button onClick={onNext} className="bg-institucional-azul hover:bg-institucional-verdeOscuro text-white font-bold py-2 px-8 rounded">Siguiente Actividad →</button>
                    </div>
                </div>
            );
        };

        const CasosPracticos = ({ data, rep, setRep, onNext }) => {
            const handleChange = (id, val) => {
                if (val.includes(',') && !val.includes(';')) {
                    alert("⚠️ ADVERTENCIA: La arquitectura del sistema exige el uso estricto del punto y coma (;) como separador de argumentos en Excel, según el estándar del taller.");
                }
                setRep({...rep, [id]: val});
            };

            return (
                <div>
                    <h2 className="text-2xl font-bold text-institucional-morado mb-2">Actividad 3: Caso Práctico Técnico (35%)</h2>
                    <p className="mb-6 text-gray-600">El aprendiz debe redactar la fórmula exacta de Excel para dar solución a los 15 escenarios planteados. <strong>Obligatorio:</strong> Utilice el signo igual (=) al inicio y punto y coma (;) como separador.</p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {data.map((r, i) => (
                            <div key={r.id} className="bg-gray-50 border-l-4 border-institucional-verde p-4 rounded shadow-sm">
                                <div className="text-xs font-bold text-institucional-verdeGris uppercase mb-1">Reto de Aplicación {i+1}</div>
                                <p className="text-sm text-gray-800 mb-3">{r.descripcion}</p>
                                <input 
                                    type="text"
                                    placeholder="Ej: =BUSCARV(A3;Reporte!$B$5:$K$50;4;FALSO)"
                                    className="w-full border border-gray-300 p-2 rounded focus:ring focus:ring-institucional-verde outline-none font-mono text-sm"
                                    value={rep[r.id] || ''}
                                    onChange={e => handleChange(r.id, e.target.value)}
                                />
                            </div>
                        ))}
                    </div>
                    <div className="mt-8 text-right">
                        <button onClick={onNext} className="bg-institucional-azul hover:bg-institucional-verdeOscuro text-white font-bold py-2 px-8 rounded">Siguiente Actividad →</button>
                    </div>
                </div>
            );
        };

        const TestTeorico = ({ data, rep, setRep, onFinish }) => {
            return (
                <div>
                    <h2 className="text-2xl font-bold text-institucional-morado mb-2">Actividad 4: Test Teórico (35%)</h2>
                    <p className="mb-6 text-gray-600">El aprendiz debe seleccionar la respuesta correcta a cada una de las 25 preguntas extraídas al azar del marco teórico.</p>
                    
                    <div className="space-y-6">
                        {data.map((q, i) => (
                            <div key={i} className="bg-white p-5 border border-gray-200 rounded shadow-sm">
                                <h3 className="font-bold text-institucional-azul mb-3">{i+1}. {q.pregunta}</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                    {q.opciones.map((opt, j) => (
                                        <label key={j} className={`flex items-center p-3 border rounded cursor-pointer hover:bg-gray-50 transition-colors ${rep[i] === opt ? 'border-institucional-verde bg-green-50' : 'border-gray-200'}`}>
                                            <input 
                                                type="radio" 
                                                name={`q-${i}`} 
                                                value={opt} 
                                                checked={rep[i] === opt}
                                                onChange={() => setRep({...rep, [i]: opt})}
                                                className="mr-3 accent-institucional-verde"
                                            />
                                            <span className="text-sm text-gray-700">{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-8 text-center bg-yellow-50 border border-yellow-200 p-4 rounded text-yellow-800">
                        <p className="font-bold">Atención: Una vez enviadas las respuestas, la evaluación finalizará y se generará el reporte en PDF.</p>
                        <button onClick={onFinish} className="mt-4 bg-institucional-morado hover:bg-institucional-azul text-white font-bold py-3 px-10 rounded shadow-lg text-lg">Finalizar Evaluación</button>
                    </div>
                </div>
            );
        };

        const Reporte = ({ user, notas }) => {
            const handlePrint = () => {
                const element = document.getElementById('reporte-pdf');
                html2pdf().set({
                    margin: 10,
                    filename: `Evaluacion_BUSCARV_${user.id}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, scrollY: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                }).from(element).save();
            };

            const getColor = (nota) => nota >= 70 ? 'text-institucional-verde' : 'text-red-600';

            return (
                <div>
                    <div id="reporte-pdf" className="p-8 bg-white" style={{ display: 'grid', gridTemplateColumns: '1fr', gap: '20px' }}>
                        <div className="text-center border-b-4 border-institucional-verde pb-4 mb-4 flex flex-col items-center">
                            <Logo />
                            <h1 className="text-3xl font-bold text-institucional-azul mt-4">RESULTADOS DE LA EVALUACIÓN</h1>
                            <h2 className="text-xl text-institucional-verdeGris">Función BUSCARV - Microsoft Excel</h2>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded border border-gray-200">
                            <div><span className="font-bold text-gray-700">Documento:</span> {user.id}</div>
                            <div><span className="font-bold text-gray-700">Ficha:</span> {user.ficha}</div>
                            <div className="col-span-2"><span className="font-bold text-gray-700">Aprendiz:</span> {user.nombres} {user.apellidos}</div>
                        </div>

                        <div className="mt-6">
                            <h3 className="text-xl font-bold text-institucional-morado border-b mb-4">Desglose de Calificación</h3>
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-institucional-azul text-white">
                                        <th className="p-3 border">Actividad</th>
                                        <th className="p-3 border">Peso</th>
                                        <th className="p-3 border">Puntaje Obtenido</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="p-3 border">Actividad 1: Crucigrama</td>
                                        <td className="p-3 border text-center">15%</td>
                                        <td className="p-3 border text-center font-bold">{notas.cruci.toFixed(2)}%</td>
                                    </tr>
                                    <tr className="bg-gray-50">
                                        <td className="p-3 border">Actividad 2: Sopa de Letras</td>
                                        <td className="p-3 border text-center">15%</td>
                                        <td className="p-3 border text-center font-bold">{notas.sopa.toFixed(2)}%</td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 border">Actividad 3: Casos Prácticos</td>
                                        <td className="p-3 border text-center">35%</td>
                                        <td className="p-3 border text-center font-bold">{notas.retos.toFixed(2)}%</td>
                                    </tr>
                                    <tr className="bg-gray-50">
                                        <td className="p-3 border">Actividad 4: Test Teórico</td>
                                        <td className="p-3 border text-center">35%</td>
                                        <td className="p-3 border text-center font-bold">{notas.test.toFixed(2)}%</td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr className="bg-gray-200">
                                        <td colSpan="2" className="p-3 border text-right font-bold text-lg">CALIFICACIÓN FINAL:</td>
                                        <td className={`p-3 border text-center font-bold text-2xl ${getColor(notas.total)}`}>{notas.total.toFixed(2)}%</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        
                        <div className="text-center mt-12 text-sm text-gray-500">
                            <p>Documento generado automáticamente por el sistema de evaluación DUA Serverless.</p>
                            <p>Fecha de ejecución: {new Date().toLocaleDateString()}</p>
                        </div>
                    </div>
                    
                    <div className="text-center mt-8">
                        <button onClick={handlePrint} className="bg-institucional-verde hover:bg-institucional-verdeOscuro text-white font-bold py-3 px-8 rounded shadow-lg flex items-center justify-center mx-auto gap-2">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Descargar Reporte PDF
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
